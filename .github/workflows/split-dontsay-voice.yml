name: Split DontSay voiceover

# Turns ONE full recording of the "Don't Say The Same As Me" voiceover into the 173 clips of docs/dontsay/lines.csv
# and wires them into the video. Start it by pushing the recording to the dontsay-quiz branch:
#
#     docs/dontsay/raw/voiceover.mp3        (or .wav / .m4a / .flac)
#
# (Re-run: Actions > this run > "Re-run all jobs". "Run workflow" only shows up once this file is on the default branch.)
#
# What it does, in order:
#   1. Whisper (faster-whisper) transcribes the recording with word timestamps.
#   2. scripts/split_dontsay_voice.py aligns the words to docs/dontsay/lines.csv and cuts one clip per row (ds_001..)
#      at the quietest point between lines. Fails, and commits nothing, if a row cannot be found.
#   3. scripts/clean_dontsay_clips.sh: trim to 0.1 s of silence at both ends, loudness -16 LUFS.
#   4. scripts/build_dontsay_timings.py: clip lengths -> src/dontsay/timings.generated.ts (slots stretch to the clips).
#   5. scripts/build_dontsay_audio_map.ts: clip ids -> rounds / bonuses / levels (src/dontsay/audioMap.ts).
#   6. tsc, then scripts/dontsay_voice_fit.ts (two voices at once? clip longer than its scene? runtime vs 10:44).
#   7. Commits the clips, timings, audio map and the alignment report back to the branch.
# The video plays the clips from src/dontsay/Voice.tsx (one layer in DontSay-Full), placed by src/dontsay/voiceCues.ts.

on:
  push:
    branches: [dontsay-quiz]
    paths: ['docs/dontsay/raw/voiceover.*']
  workflow_dispatch:
    inputs:
      audio:
        description: 'Path of the recording in the repo (empty = docs/dontsay/raw/voiceover.*)'
        required: false
        default: ''
      model:
        description: 'Whisper model (small.en is fine; medium.en is more accurate and slower)'
        required: false
        default: 'small.en'

permissions:
  contents: write

concurrency:
  group: dontsay-voice
  cancel-in-progress: true

jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Tools
        run: |
          ffmpeg -version | head -1
          pip install --no-input faster-whisper numpy
          npm install --no-audit --no-fund

      - name: Find the recording
        id: find
        env:
          INPUT_AUDIO: ${{ github.event.inputs.audio }}
          INPUT_MODEL: ${{ github.event.inputs.model }}
        run: |
          AUDIO="$INPUT_AUDIO"
          [ -n "$AUDIO" ] || AUDIO="$(ls docs/dontsay/raw/voiceover.* 2>/dev/null | head -1 || true)"
          [ -n "$AUDIO" ] && [ -f "$AUDIO" ] || { echo "::error::no recording found (expected docs/dontsay/raw/voiceover.mp3)"; exit 1; }
          echo "audio=$AUDIO" >> "$GITHUB_OUTPUT"
          echo "model=${INPUT_MODEL:-small.en}" >> "$GITHUB_OUTPUT"
          ffprobe -v error -show_entries format=duration -of csv=p=0 "$AUDIO" | xargs printf 'recording: %s s\n'

      - name: Cache the Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ steps.find.outputs.model }}

      - name: Transcribe and split into clips
        run: |
          python3 scripts/split_dontsay_voice.py \
            --audio "${{ steps.find.outputs.audio }}" \
            --model "${{ steps.find.outputs.model }}" \
            --report docs/dontsay/voice_alignment.md

      - name: Report
        if: always()
        run: |
          [ -f docs/dontsay/voice_alignment.md ] && cat docs/dontsay/voice_alignment.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Clean the clips (trim, -16 LUFS)
        run: bash scripts/clean_dontsay_clips.sh

      - name: Timings and audio map
        run: |
          python3 scripts/build_dontsay_timings.py
          npx tsx scripts/build_dontsay_audio_map.ts

      - name: Type-check
        run: npx tsc --noEmit

      - name: Placement check
        run: |
          set -o pipefail
          npx tsx scripts/dontsay_voice_fit.ts | tee voice_fit.txt
          { echo '## Voice placement'; echo '```'; cat voice_fit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if grep -Eq '^OVERLAPS.*: [1-9]' voice_fit.txt; then echo "::warning::some clips overlap the next one (see the Voice placement summary): shorten those lines or lengthen their slots"; fi

      - name: Keep the work files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dontsay-voice-work
          path: |
            docs/dontsay/voice_alignment.*
            voice_fit.txt
            src/dontsay/timings.csv
          if-no-files-found: ignore

      - name: Commit the clips and wiring
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/dontsay/voiceover/clips src/dontsay/timings.csv src/dontsay/timings.generated.ts src/dontsay/audioMap.ts docs/dontsay/voice_alignment.md
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "dontsay: split full voiceover into 173 clips, timings and audio map"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
