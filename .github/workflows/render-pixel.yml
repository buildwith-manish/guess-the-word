name: Render Pixel Quiz (parallel)

# prepare -> N parallel video-only chunks + 1 audio pass -> merge (no re-encode of video)
#
# Run it from Actions -> "Render Pixel Quiz (parallel)" -> Run workflow, and pick the
# branch that holds the video (pixelated-quiz). Download the result from the run's
# "Artifacts" section (pixel-guess-final).

on:
  workflow_dispatch:
    inputs:
      chunks:
        description: 'Parallel render jobs (Pro plan allows 40 at once, Free 20)'
        type: choice
        options: ['40', '20', '10']
        default: '40'
      test_frames:
        description: 'Test mode: render only the first N frames (0 = full video)'
        type: string
        default: '0'
      crf:
        description: 'x264 CRF (lower = better quality, bigger file)'
        type: string
        default: '14'
      preset:
        description: 'x264 preset'
        type: choice
        options: ['slow', 'medium', 'fast']
        default: 'slow'

env:
  COMPOSITION: PixelGuess

jobs:
  # ---------------------------------------------------------------------------
  # 1. PREPARE: real frame count from Remotion -> list of frame ranges
  # ---------------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      total: ${{ steps.plan.outputs.total }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Measure voiceover clips
        run: node scripts/voiceover-scan.js

      - name: Install Chrome for Remotion
        run: npx remotion browser ensure

      - name: Plan the chunks
        id: plan
        env:
          CHUNKS: ${{ inputs.chunks }}
          TEST_FRAMES: ${{ inputs.test_frames }}
        run: |
          npx remotion compositions src/index.ts --quiet --json > comps.raw 2> comps.err || { cat comps.err; exit 1; }
          python3 - <<'PY'
          import json, os, re, math
          raw = open('comps.raw').read()
          m = re.search(r'[\[{]', raw)
          data = json.loads(raw[m.start():])
          comps = data['compositions'] if isinstance(data, dict) else data
          comp = next(c for c in comps if c['id'] == os.environ['COMPOSITION'])
          total = int(comp['durationInFrames'])
          test = int(os.environ.get('TEST_FRAMES') or 0)
          if test > 0:
              total = min(total, test)
          want = int(os.environ['CHUNKS'])
          count = max(1, min(want, total))
          per = math.ceil(total / count)
          include = []
          for i in range(count):
              start = i * per
              end = min(total - 1, start + per - 1)
              if start > end:
                  break
              include.append({'i': i, 'name': f'{i:03d}', 'start': start, 'end': end})
          count = len(include)
          print(f"{comp['id']}: {comp['width']}x{comp['height']} @ {comp['fps']}fps, {total} frames -> {count} chunks of up to {per}")
          out = os.environ['GITHUB_OUTPUT']
          with open(out, 'a') as f:
              f.write('matrix=' + json.dumps({'include': include}) + '\n')
              f.write(f'total={total}\n')
              f.write(f'count={count}\n')
          PY

  # ---------------------------------------------------------------------------
  # 2a. RENDER: each job renders its frame range, video only (--muted)
  # ---------------------------------------------------------------------------
  render:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Measure voiceover clips
        run: node scripts/voiceover-scan.js

      - name: Install Chrome for Remotion
        run: npx remotion browser ensure

      - name: Render frames ${{ matrix.start }}-${{ matrix.end }}
        run: |
          mkdir -p out
          npx remotion render src/index.ts "$COMPOSITION" "out/chunk-${{ matrix.name }}.mp4" \
            --frames=${{ matrix.start }}-${{ matrix.end }} \
            --muted \
            --codec=h264 \
            --pixel-format=yuv420p \
            --color-space=bt709 \
            --image-format=png \
            --crf=${{ inputs.crf }} \
            --x264-preset=${{ inputs.preset }} \
            --concurrency=$(nproc) \
            --log=info
          ls -la out/

      - name: Upload chunk
        uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.name }}
          path: out/chunk-${{ matrix.name }}.mp4
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 2b. AUDIO: one pass over the whole timeline, so there are no seams
  # ---------------------------------------------------------------------------
  audio:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Measure voiceover clips
        run: node scripts/voiceover-scan.js

      - name: Install Chrome for Remotion
        run: npx remotion browser ensure

      - name: Render audio only (lossless WAV)
        run: |
          mkdir -p out
          npx remotion render src/index.ts "$COMPOSITION" out/audio.wav \
            --codec=wav \
            --log=info
          ls -la out/

      - name: Upload audio
        uses: actions/upload-artifact@v4
        with:
          name: pixel-audio
          path: out/audio.wav
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3. MERGE: join chunks without re-encoding video, encode audio once
  # ---------------------------------------------------------------------------
  merge:
    needs: [prepare, render, audio]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Download chunks
        uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          path: parts
          merge-multiple: true

      - name: Download audio
        uses: actions/download-artifact@v4
        with:
          name: pixel-audio
          path: audio

      - name: Join chunks + mux audio
        env:
          EXPECT_CHUNKS: ${{ needs.prepare.outputs.count }}
          EXPECT_FRAMES: ${{ needs.prepare.outputs.total }}
          TEST_FRAMES: ${{ inputs.test_frames }}
        run: |
          set -euo pipefail
          ls parts | sort > /dev/null
          GOT=$(ls parts/chunk-*.mp4 | wc -l)
          echo "chunks found: $GOT / expected $EXPECT_CHUNKS"
          [ "$GOT" -eq "$EXPECT_CHUNKS" ] || { echo "Missing chunks"; exit 1; }

          : > list.txt
          for f in $(ls parts/chunk-*.mp4 | sort); do
            echo "file '$PWD/$f'" >> list.txt
          done

          # 1) lossless join of the video (stream copy, no re-encode)
          ffmpeg -y -v error -f concat -safe 0 -i list.txt -c copy video-only.mp4

          FRAMES=$(ffprobe -v error -select_streams v:0 -count_packets -show_entries stream=nb_read_packets -of csv=p=0 video-only.mp4)
          echo "video frames: $FRAMES / expected $EXPECT_FRAMES"
          [ "$FRAMES" -eq "$EXPECT_FRAMES" ] || { echo "Frame count mismatch"; exit 1; }

          # 2) add the single-pass audio (encoded once, 320k AAC)
          SHORTEST=""
          if [ "${TEST_FRAMES:-0}" != "0" ]; then SHORTEST="-shortest"; fi
          ffmpeg -y -v error -i video-only.mp4 -i audio/audio.wav \
            -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 320k $SHORTEST \
            -movflags +faststart pixel-guess.mp4

          ls -la pixel-guess.mp4
          echo "video duration: $(ffprobe -v error -select_streams v:0 -show_entries stream=duration -of csv=p=0 pixel-guess.mp4)"
          echo "audio duration: $(ffprobe -v error -select_streams a:0 -show_entries stream=duration -of csv=p=0 pixel-guess.mp4)"

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: pixel-guess-final
          path: pixel-guess.mp4
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
